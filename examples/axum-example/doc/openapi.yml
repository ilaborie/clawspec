openapi: 3.2.0
info:
  title: Bird Observation API
  description: A comprehensive API for managing bird observations with support for multiple content types, file uploads, and bulk operations. This API demonstrates RESTful design patterns and provides comprehensive CRUD operations for bird observation data.
  contact:
    name: Bird Observation Team
    url: https://birdwatch.example.com/support
    email: api-support@birdwatch.example.com
  version: 1.0.0
servers:
- url: https://api.birdwatch.example.com/api
  description: Production server
  name: production
paths:
  /api/health:
    get:
      tags:
      - health
      description: Public health check endpoint - no authentication required
      operationId: get-health
      parameters: []
      responses:
        '200':
          description: Status code 200
          content:
            application/json: {}
      security: []
  /api/observations:
    get:
      tags:
      - listing
      - observations
      summary: List observations
      description: Retrieve observations
      operationId: get-observations
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
      - name: X-User-ID
        in: header
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: X-Client-Version
        in: header
        required: false
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Status code 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListObservations'
      security:
      - apiKey: []
    post:
      tags:
      - observations
      summary: Create an observation
      description: Create observation
      operationId: post-observations
      parameters:
      - name: X-Test-Case
        in: header
        required: false
        schema:
          type: string
      - name: X-Expected-Status
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialObservation'
            example:
              color: rainbow
              name: Redaction Demo Bird
              notes: This observation demonstrates the redaction feature
              position:
                lat: 0.0
                lng: 0.0
          application/pdf:
            schema:
              type: string
              format: binary
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FlatObservation'
            example:
              color: orange
              lat: 3.5
              lng: 2.5
              name: Form Bird
              notes: Created via form encoding
          text/xml:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Status code 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
              example:
                color: rainbow
                created_at: 2024-01-01T00:00:00Z
                id: 019aaaaa-0000-7000-8000-000000000000
                name: Redaction Demo Bird
                notes: This observation demonstrates the redaction feature
                position:
                  lat: 0.0
                  lng: 0.0
        '400':
          description: Status code 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestClientError'
        '415':
          description: Status code 415
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestClientError'
      security:
      - bearerAuth: []
    query:
      tags:
      - observations
      description: Query observations
      operationId: query-observations
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchObservations'
            example:
              name: gull
      responses:
        '200':
          description: Status code 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListObservations'
      security:
      - bearerAuth: []
  /api/observations/events:
    get:
      tags:
      - observations
      - events
      summary: Stream observation events
      description: Retrieve events
      operationId: get-observations-events
      parameters: []
      responses:
        '200':
          description: Status code 200
          content:
            text/event-stream:
              itemSchema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: string
                    contentMediaType: application/json
                    contentSchema:
                      $ref: '#/components/schemas/ObservationEvent'
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    type: integer
                    minimum: 0
              examples:
                first-items:
                  summary: First items of the stream
                  serializedValue: |+
                    event: observation
                    id: 019aaaaa-0000-7000-8000-000000000113
                    data: {"observation_id":"019aaaaa-0000-7000-8000-000000000113","name":"Admiral, indian red"}

                    event: observation
                    id: 019aaaaa-0000-7000-8000-000000000238
                    data: {"observation_id":"019aaaaa-0000-7000-8000-000000000238","name":"African buffalo"}

                    event: observation
                    id: 019aaaaa-0000-7000-8000-000000000645
                    data: {"observation_id":"019aaaaa-0000-7000-8000-000000000645","name":"African bush squirrel"}

      security:
      - bearerAuth: []
  /api/observations/export:
    get:
      tags:
      - observations
      - export
      summary: Export all observations as NDJSON
      description: Export observations
      operationId: get-observations-export
      parameters: []
      responses:
        '200':
          description: Status code 200
          content:
            application/x-ndjson:
              itemSchema:
                $ref: '#/components/schemas/Observation'
              examples:
                first-items:
                  summary: First items of the stream
                  serializedValue: |
                    {"id":"019aaaaa-0000-7000-8000-000000000113","created_at":"2024-01-01T00:00:00Z","name":"Admiral, indian red","position":{"lng":-74.4088,"lat":6.477755},"color":"#52adeb","notes":"Phasellus sit amet erat. Nulla tempus. Vivamus in felis eu sapien cursus vestibulum.\n\nProin eu mi. Nulla ac enim. In tempor, turpis nec euismod scelerisque, quam turpis adipiscing lorem, vitae mattis nibh ligula nec sem."}
                    {"id":"019aaaaa-0000-7000-8000-000000000238","created_at":"2024-01-14T00:00:00Z","name":"African buffalo","position":{"lng":108.7231,"lat":-7.1554},"color":"#7426bf","notes":"Integer tincidunt ante vel ipsum. Praesent blandit lacinia erat. Vestibulum sed magna at nunc commodo placerat.\n\nPraesent blandit. Nam nulla. Integer pede justo, lacinia eget, tincidunt eget, tempus vel, pede.\n\nMorbi porttitor lorem id ligula. Suspendisse ornare consequat lectus. In est risus, auctor sed, tristique in, tempus sit amet, sem."}
                    {"id":"019aaaaa-0000-7000-8000-000000000645","created_at":"2024-01-01T00:00:00Z","name":"African bush squirrel","position":{"lng":-1.0634024,"lat":11.66503},"color":"#be6b0a","notes":"In congue. Etiam justo. Etiam pretium iaculis justo."}
      security:
      - bearerAuth: []
  /api/observations/import:
    post:
      tags:
      - admin
      - bulk-operations
      - import
      - observations
      description: Import observations
      operationId: post-observations-import
      parameters: []
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Status code 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
      security:
      - bearerAuth: []
  /api/observations/names:
    get:
      tags:
      - observations
      summary: List observation names
      description: Retrieve names
      operationId: get-observations-names
      parameters:
      - name: ListOption
        in: querystring
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListOption'
      responses:
        '200':
          description: Status code 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationNames'
      security:
      - bearerAuth: []
  /api/observations/upload:
    post:
      tags:
      - file-operations
      - observations
      - upload
      description: Upload observations
      operationId: post-observations-upload
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Status code 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
      security:
      - bearerAuth: []
  /api/observations/{observation_id}:
    get:
      tags:
      - observations
      description: Retrieve observation by ID
      operationId: get-observations-observation-id
      parameters:
      - name: observation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObservationId'
      responses:
        '200':
          description: Status code 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
      security:
      - bearerAuth: []
    put:
      tags:
      - modification
      - observations
      summary: Update an observation
      description: Update observation by ID
      operationId: put-observations-observation-id
      parameters:
      - name: observation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObservationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialObservation'
            example:
              color: rainbow
              name: Updated Metadata Demo
              notes: Used to demonstrate OpenAPI metadata features
              position:
                lat: -90.0
                lng: 45.0
      responses:
        '200':
          description: Status code 200
      security:
      - bearerAuth: []
    delete:
      tags:
      - observations
      summary: Delete an observation
      description: Delete observation by ID
      operationId: delete-observations-observation-id
      parameters:
      - name: observation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObservationId'
      responses:
        '200':
          description: Status code 200
          content:
            application/json: {}
      security:
      - bearerAuth: []
    patch:
      tags:
      - observations
      description: Partially update observation by ID
      operationId: patch-observations-observation-id
      parameters:
      - name: observation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObservationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchObservation'
            example:
              color: red
              name: Partially Updated Parrot
      responses:
        '200':
          description: Status code 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
      security:
      - bearerAuth: []
components:
  schemas:
    ExtractorError:
      oneOf:
      - type: object
        description: JSON parsing or serialization error
        required:
        - details
        - type
        properties:
          details:
            type: object
            description: JSON parsing or serialization error
            required:
            - message
            properties:
              location:
                type:
                - string
                - 'null'
                description: Location where the error occurred (e.g., "body", "`field_name`")
              message:
                type: string
                description: Detailed error message
          type:
            type: string
            enum:
            - JsonError
      - type: object
        description: XML parsing error
        required:
        - details
        - type
        properties:
          details:
            type: object
            description: XML parsing error
            required:
            - message
            properties:
              element:
                type:
                - string
                - 'null'
                description: XML element where the error occurred
              message:
                type: string
                description: Detailed error message
          type:
            type: string
            enum:
            - XmlError
      - type: object
        description: Form data processing error
        required:
        - details
        - type
        properties:
          details:
            type: object
            description: Form data processing error
            required:
            - message
            properties:
              field:
                type:
                - string
                - 'null'
                description: Form field that caused the error
              message:
                type: string
                description: Detailed error message
          type:
            type: string
            enum:
            - FormError
      - type: object
        description: Multipart processing error
        required:
        - details
        - type
        properties:
          details:
            type: object
            description: Multipart processing error
            required:
            - message
            properties:
              message:
                type: string
                description: Detailed error message
              part:
                type:
                - string
                - 'null'
                description: Multipart section that caused the error
          type:
            type: string
            enum:
            - MultipartError
      - type: object
        description: Encoding/decoding error (e.g., UTF-8 conversion)
        required:
        - details
        - type
        properties:
          details:
            type: object
            description: Encoding/decoding error (e.g., UTF-8 conversion)
            required:
            - message
            - encoding
            properties:
              encoding:
                type: string
                description: Expected encoding type
              message:
                type: string
                description: Detailed error message
          type:
            type: string
            enum:
            - EncodingError
      - type: object
        description: Unsupported content type
        required:
        - details
        - type
        properties:
          details:
            type: object
            description: Unsupported content type
            required:
            - content_type
            - supported
            properties:
              content_type:
                type: string
                description: The unsupported content type
              supported:
                type: array
                items:
                  type: string
                description: List of supported content types
          type:
            type: string
            enum:
            - UnsupportedMediaType
      - type: object
        description: Generic bad request error
        required:
        - details
        - type
        properties:
          details:
            type: object
            description: Generic bad request error
            required:
            - message
            properties:
              message:
                type: string
                description: Detailed error message
          type:
            type: string
            enum:
            - BadRequest
      description: |-
        Custom error type for extractors that provides structured error responses.

        This enum represents different types of extraction failures that can occur
        when processing HTTP requests. Each variant corresponds to a specific error
        scenario and provides appropriate HTTP status codes and error details.
    FlatObservation:
      allOf:
      - $ref: '#/components/schemas/LngLat'
      - type: object
        required:
        - name
        properties:
          color:
            type:
            - string
            - 'null'
          name:
            type: string
          notes:
            type:
            - string
            - 'null'
      description: Flattened observation structure for form data that doesn't support nested objects.
    ImportResponse:
      type: object
      required:
      - imported
      - error_count
      - bytes_processed
      - created_ids
      properties:
        bytes_processed:
          type: integer
          minimum: 0
        created_ids:
          type: array
          items:
            $ref: '#/components/schemas/ObservationId'
        error_count:
          type: integer
          minimum: 0
        errors:
          type:
          - array
          - 'null'
          items:
            type: string
        imported:
          type: integer
          minimum: 0
    ListObservations:
      type: object
      required:
      - observations
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
    ListOption:
      type: object
      properties:
        limit:
          type: integer
          default: 10
          minimum: 0
        offset:
          type: integer
          default: 0
          minimum: 0
    LngLat:
      type: object
      required:
      - lng
      - lat
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    Observation:
      allOf:
      - $ref: '#/components/schemas/PartialObservation'
      - type: object
        required:
        - id
        - created_at
        properties:
          created_at:
            type: string
            example: 2024-01-01T00:00:00Z
          id:
            $ref: '#/components/schemas/ObservationId'
    ObservationEvent:
      type: object
      description: Payload of a server-sent observation event.
      required:
      - observation_id
      - name
      properties:
        name:
          type: string
        observation_id:
          $ref: '#/components/schemas/ObservationId'
    ObservationId:
      type: string
      format: uuid
    ObservationNames:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          items:
            type: string
    PartialObservation:
      type: object
      required:
      - name
      - position
      properties:
        color:
          type:
          - string
          - 'null'
        name:
          type: string
        notes:
          type:
          - string
          - 'null'
        position:
          $ref: '#/components/schemas/LngLat'
    PatchObservation:
      type: object
      properties:
        color:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        position:
          oneOf:
          - $ref: '#/components/schemas/LngLat'
          - type: 'null'
    SearchObservations:
      type: object
      properties:
        color:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    TestClientError:
      type: object
      required:
      - status
      - timestamp
      - error
      properties:
        error:
          $ref: '#/components/schemas/ExtractorError'
        status:
          type: integer
          format: int32
          minimum: 0
        timestamp:
          type: string
    UploadResponse:
      type: object
      required:
      - uploaded
      - error_count
      - created_ids
      properties:
        created_ids:
          type: array
          items:
            $ref: '#/components/schemas/ObservationId'
        error_count:
          type: integer
          minimum: 0
        errors:
          type:
          - array
          - 'null'
          items:
            type: string
        uploaded:
          type: integer
          minimum: 0
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service authentication
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login endpoint
    legacyApiKey:
      type: apiKey
      in: header
      name: X-Legacy-Key
      description: Legacy API key, use apiKey instead
      deprecated: true
security:
- bearerAuth: []
tags:
- name: admin
- name: bulk-operations
- name: events
- name: export
- name: file-operations
- name: health
- name: import
- name: listing
- name: modification
- name: observations
  summary: Observations
  description: Create, read, update and delete bird observations
  kind: nav
- name: upload
